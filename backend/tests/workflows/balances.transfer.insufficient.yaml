id: balances.transfer.insufficient
description: A transfer larger than the balance must fail at dispatch and move no funds to the receiver.
importance: core
accounts: [sender, receiver]
fund:
  - { account: sender, amount: "100000000000000000" }   # 1000 POT
steps:
  - call: Balances.transfer
    signer: sender
    args: { dest: receiver, value: "10000000000000000000" } # 100000 POT
expect:
  # older runtimes: Balances.InsufficientBalance; newer pallet-balances (V3): Token.FundsUnavailable
  - dispatch: { step: 0, status: failed, error: "InsufficientBalance|FundsUnavailable" }
  - delta: { account: receiver, field: free, eq: "0" }
  - event: { step: 0, name: system.ExtrinsicFailed }
  - invariant: supply_conservation
